name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Desktop session sync depends on per-OS profile paths and process detection.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Single stable check for branch protection: matrix job names change whenever
  # the matrix does, so require `ci-ok` instead of individual `test (...)` jobs.
  ci-ok:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "test matrix result: $TEST_RESULT"
          test "$TEST_RESULT" = "success"
