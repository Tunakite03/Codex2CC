name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-os:
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Desktop session sync depends on per-OS profile paths and process detection.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Branch protection requires the check names `test (22)` and `test (24)`.
  # Adding `os` to the matrix above renamed those jobs, so these gates report
  # the required names and pass only when every OS/Node combination passed.
  test:
    if: always()
    needs: test-os
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Require every OS/Node job to succeed
        env:
          TEST_OS_RESULT: ${{ needs.test-os.result }}
        run: |
          echo "test-os matrix result: $TEST_OS_RESULT"
          test "$TEST_OS_RESULT" = "success"
